receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  # Console exporter for debugging
  debug:
    verbosity: detailed
  
  # Prometheus exporter
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "sample_app"
    
  # OTLP exporter to another collector/backend (uncomment if needed)
  # otlp:
  #   endpoint: "http://jaeger:4317"
  #   tls:
  #     insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
  
  extensions: []